[project]
name = "llm-output-safety-guard"
version = "0.1.0"
description = "A staged learning project for Chinese LLM output safety moderation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.10",
    "datasets>=3.6",
    "fastapi[standard]>=0.116",
    "peft>=0.17",
    "safetensors>=0.5",
    "scikit-learn>=1.7",
    "torch>=2.7",
    "transformers>=4.55",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"
